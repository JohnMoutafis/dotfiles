setupVersion: 3
symbolPreset: nerd
theme:
  dark: titanium
statusLine:
  preset: default
  transparent: false
  showHookStatus: true
personality: pragmatic
tui:
  textSizing: false
display:
  showTokenUsage: true
  caheMissMarker: true
modelRoles:
  default: opencode-go/deepseek-v4.1-flash:high
  smol: opencode-go/deepseek-v4.1-flash:low
  task: opencode-go/deepseek-v4.1-flash
  slow: opencode-go/deepseek-v4.1-flash:high
  plan: opencode-go/glm-5.3:high
task:
  reviewer: opencode-go/glm-5.3:high
  eager: preferred
mp:
  notifications: true
readLineNumbers: true
proseOnlyThinking: true
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  llmMode: smol
autolearn:
  enabled: true
compaction:
  handoffSaveToDisk: true
composer:
  shape: box
temperature: 0.2
dev:
  autoqaConsent: granted
cycleOrder:
  - smol
  - default
  - slow
  - plan
defaultThinkingLevel: auto
hideThinkingBlock: true
update:
  auto: false
