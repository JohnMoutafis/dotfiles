# =======================
#        Plugins
# =======================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'vaaleyard/tmux-dotbar'

# =======================
#      Configuration
# =======================
# Enable mouse
set -g mouse on
set -g default-terminal "tmux-256color"
# True colors in terminal
set-option -sa terminal-overrides ",xterm*:Tc"

# use C-Space and C-f for the prefix.
set-option -g prefix C-Space
set-option -g prefix2 C-f
bind-key C-Space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# set vi-mode
set-window-option -g mode-keys vi

# Continuum configuration
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '60'

# dotbar configuration
set -g @tmux-dotbar-right true
## Match Tokyo Night color scheme
set -g @tmux-dotbar-bg "#1a1b26"
set -g @tmux-dotbar-fg "#565f89"
set -g @tmux-dotbar-fg-current "#c0caf5"
set -g @tmux-dotbar-fg-session "#c0caf5"
set -g @tmux-dotbar-fg-prefix "#7aa2f7"

# =======================
#       keybindings
# =======================
# Open new pane in the same directory
# Alt + Shift + h = split horizontally
bind -n M-H split-window -h -c '#{pane_current_path}'
# Alt + Shift + v = split vertically
bind -n M-V split-window -v -c '#{pane_current_path}'
# Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Synchronize panes
bind-key s set-window-option synchronize-panes\; display-message "synchronize mode toggled."

# -----------------
#    Navigation
# -----------------
# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
