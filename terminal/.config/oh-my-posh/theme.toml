version = 3
final_space = true
console_title_template = '{{ .Shell }} in {{ .Folder }}'

# Theme colors
[palette]
p10k_bg = '#303030'
p10k_blue = '#0e82a7'
p10k_green = '#5FD504'
dark_magenta = '#8b008b'
warning = '#ff6700'

# Check for updates
[upgrade]
source = 'cdn'
interval = '168h'
notice = true
auto = false

# Main prompt
[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

  [[blocks.segments]]
    type = 'path'
    style = 'plain'
    background = 'transparent'
    foreground = 'p:p10k_blue'
    template = '{{ .Path }}'

    [blocks.segments.properties]
      style = 'full'

  # Git status, only shown inside a repo
  # Reproduces bash-git-prompt (https://github.com/magicmonty/bash-git-prompt) 
  # Format: [<branch><upstream?><tracking>|<local_status>]
  # bash-git-prompt symbols:
  #   ↑n  ahead     ↓n  behind     ↓m↑n  diverged    L  local-only
  #   ●n  staged    ✖n  conflicts  ✚n  unstaged     …n  untracked   ⚑n  stash
  #   ✔   clean
  [[blocks.segments]]
    type = 'git'
    style = 'plain'
    foreground = 'p:p10k_green'
    background = 'transparent'
    foreground_templates = [
      # diverged → orange
      "{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:warning{{ end }}",
      # dirty working tree → magenta
      "{{ if or (.Working.Changed) (.Staging.Changed) }}magenta{{ end }}",
    ]
    template = """ [\
        {{ if .Detached }}:{{ .ShortHash }}{{ else }}{{ .HEAD }}{{ end }}\
        {{ if .UpstreamGone }} L\
        {{ else if and (gt .Ahead 0) (gt .Behind 0) }} ↓{{ .Behind }}↑{{ .Ahead }}\
        {{ else if gt .Ahead 0 }} ↑{{ .Ahead }}\
        {{ else if gt .Behind 0 }} ↓{{ .Behind }}\
        {{ end }}\
        |{{ if and (not .Staging.Changed) (not .Working.Changed) (eq .StashCount 0) }}✔\
        {{ else }}\
        {{ if .Staging.Changed }}●{{ add .Staging.Added .Staging.Modified }}{{ if gt .Staging.Deleted 0 }}✖{{ .Staging.Deleted }}{{ end }}{{ end }}\
        {{ if gt .Working.Unmerged 0 }}✖{{ .Working.Unmerged }}{{ end }}\
        {{ if and .Working.Changed (gt .Working.Modified 0) }}✚{{ .Working.Modified }}{{ end }}\
        {{ if and .Working.Changed (gt .Working.Deleted 0) }}-{{ .Working.Deleted }}{{ end }}\
        {{ if gt .Working.Untracked 0 }}…{{ .Working.Untracked }}{{ end }}\
        {{ if gt .StashCount 0 }}⚑{{ .StashCount }}{{ end }}\
        {{ end }}\
    ]"""

    [blocks.segments.properties]
      fetch_status        = true
      fetch_upstream_icon = false
      branch_icon         = ""
      commit_icon         = ""

# Right prompt with execution time, if the command exceeded threshold
[[blocks]]
  type = 'rprompt'
  overflow = 'hidden'

  [[blocks.segments]]
    type = 'executiontime'
    style = 'plain'
    foreground = 'yellow'
    background = 'transparent'
    template = '{{ .FormattedMs }}'

    [blocks.segments.properties]
      threshold = 3000

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  # Python venv indicator
  [[blocks.segments]]
    type = 'python'
    style = 'plain'
    background = 'transparent'
    foreground = 'yellow'
    template = '[{{ if .Error }}{{ .Error }}{{ else }}{{ .Venv }}{{ end }}] '

    [blocks.segments.properties]
      fetch_virtual_env = true
      fetch_version = false
      display_default = false

  # Go version indicator
  [[blocks.segments]]
    type = "go"
    style = "plain"
    background = "transparent"
    foreground = "yellow"
    template = "[go {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}] "

    [blocks.segments.properties]
      display_mode = "files"
      display_default = false
      fetch_version = true
      parse_mod_file = true
      parse_go_work_file = true

  # Prompt indicator
  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    foreground_templates = [
      "{{if gt .Code 0}}red{{end}}",
      "{{if eq .Code 0}}p:dark_magenta{{end}}",
    ]
    background = 'transparent'
    template = '❯'

[transient_prompt]
  foreground_templates = [
    "{{if gt .Code 0}}red{{end}}",
    "{{if eq .Code 0}}p:dark_magenta{{end}}",
  ]
  background = 'transparent'
  template = '❯ '

[secondary_prompt]
  foreground = 'p:dark_magenta'
  background = 'transparent'
  template = '❯❯ '
